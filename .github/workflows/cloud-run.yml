name: "Cloud Run"

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch: {}
  repository_dispatch:
    types:
      - deploy

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cloudrun:
    name: "Cloud Run"
    runs-on: ubuntu-latest
    permissions:
      id-token: write # This is required for requesting the JWT
      contents: read # This is required for actions/checkout
      pull-requests: write # Write contents to the PR
    # Use the Bash shell regardless whether the GitHub Actions runner is ubuntu-latest, macos-latest, or windows-latest
    defaults:
      run:
        shell: bash
    env:
      DEBIAN_FRONTEND: noninteractive
      NEXT_PUBLIC_FIREBASE_APIKEY: ${{ vars.NEXT_PUBLIC_FIREBASE_APIKEY }}
      NEXT_PUBLIC_OAUTH_CLIENT_ID: ${{ vars.NEXT_PUBLIC_OAUTH_CLIENT_ID }}
      NEXT_PUBLIC_FIRESTORE_DB: ${{ vars.NEXT_PUBLIC_FIRESTORE_DB }}
      NEXT_PUBLIC_RECAPTCHA_KEY: ${{ vars.NEXT_PUBLIC_RECAPTCHA_KEY }}
      GOOGLE_CLOUD_PROJECT: ${{ vars.GOOGLE_CLOUD_PROJECT }}
      AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
      EINSATZMAPPE_IMPERSONATION_ACCOUNT: ${{ secrets.EINSATZMAPPE_IMPERSONATION_ACCOUNT }}
      RUN_SERVICE: ${{ vars.RUN_SERVICE}}
      RUN_REGION: ${{ vars.RUN_REGION }}
      RUN_SERVICE_ACCOUNT: ${{ secrets.RUN_SERVICE_ACCOUNT}}
      CLOUDSDK_CORE_PROJECT: ${{ vars.CLOUDSDK_CORE_PROJECT }}
      CLOUDSDK_COMPUTE_REGION: ${{ vars.CLOUDSDK_COMPUTE_REGION }}
      IMAGE: ${{ vars.IMAGE }}
      workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}

    steps:
      # Checkout the repository to the GitHub Actions runner
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Setup env
        shell: bash
        id: env
        run: |
          # write env file
          set -eo pipefail
          VERSION=${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}
          VERSION_TAG=$(echo ${VERSION} | tr '[:upper:]' '[:lower:]'} | sed -r 's@[^a-zA-Z0-9-]+@-@g' )
          VERSION_TAG=$(echo -n ${VERSION_TAG:0:30} | sed 's@-$@@')
          export NEXTAUTH_URL="https://einsatz-dev.ffnd.at"
          export SUMUP_SECRET_SUFFIX="_DEV"

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            export NEXT_PUBLIC_FIRESTORE_DB=""
            export RUN_SERVICE=$(echo -n "${RUN_SERVICE}" | sed 's/-dev$//')
            export NEXTAUTH_URL="https://einsatz.ffnd.at"
            export SUMUP_SECRET_SUFFIX=""
          fi

          # Allowlist der Service Accounts, die zeitplan-gesteuerte Endpoints
          # aufrufen dürfen (cronRequired). Beide Umgebungen stehen drin, weil
          # ein Invoker aus dev auch gegen den dev-Dienst legitim ist; die Namen
          # kommen aus terraform/modules/cloud-scheduler (account_id plus
          # name_suffix) und müssen dort und hier gleich lauten.
          #
          # Bewusst eine Env-Var und kein Secret-Manager-Secret: der Wert ist
          # eine Kennung, kein Geheimnis (wer sie kennt, kann kein Token dafür
          # ausstellen - dazu braucht es IAM-Rechte auf den SA). Als Secret hinge
          # jedes Deploy daran, dass vorher ein terraform apply gelaufen ist -
          # und der prod-apply, dem die Projekt-Basis gehört, läuft nur bei einem
          # Release.
          export CRON_INVOKER_EMAILS="fahrtenbuch-report-invoker@${GOOGLE_CLOUD_PROJECT}.iam.gserviceaccount.com,fahrtenbuch-report-invoker-dev@${GOOGLE_CLOUD_PROJECT}.iam.gserviceaccount.com"

          if [[ "${NEXT_PUBLIC_FIRESTORE_DB}" == "default" || "${NEXT_PUBLIC_FIRESTORE_DB}" == "(default)" ]]; then
            # '(default)' / 'default' sentinel -> empty string selects the default DB
            export NEXT_PUBLIC_FIRESTORE_DB=""
          fi

          # Die NEXT_PUBLIC_*-Werte werden von next build fest ins Client-Bundle
          # inlined. Fehlen sie, baut das Image fehlerfrei und die App ist erst im
          # Browser kaputt ('"projectId" not provided in firebase.initializeApp.').
          # Ein Deploy ohne Firebase-Konfiguration bricht deshalb hier ab.
          if [[ -n "${workload_identity_provider}" && -z "${NEXT_PUBLIC_FIREBASE_APIKEY}" ]]; then
            echo "::error::Repository-Variable NEXT_PUBLIC_FIREBASE_APIKEY ist leer - das Image würde ohne Firebase-Konfiguration gebaut."
            exit 1
          fi

          echo "Environment:"
          cat <<EOF | tee -a $GITHUB_ENV | tee -a $GITHUB_OUTPUT
          VERSION=${VERSION}
          VERSION_TAG=${VERSION_TAG}
          RUN_SERVICE=${RUN_SERVICE}
          RUN_REGION=${RUN_REGION}
          NEXT_PUBLIC_FIRESTORE_DB=${NEXT_PUBLIC_FIRESTORE_DB}
          IMAGE=${IMAGE}
          IMAGE_TAG=${IMAGE}:${VERSION_TAG}
          NEXTAUTH_URL=${NEXTAUTH_URL}
          NEXTAUTH_URL_INTERNAL=http://localhost:8080
          NEXT_PUBLIC_RECAPTCHA_KEY=${NEXT_PUBLIC_RECAPTCHA_KEY}
          SUMUP_SECRET_SUFFIX=${SUMUP_SECRET_SUFFIX}
          CRON_INVOKER_EMAILS=${CRON_INVOKER_EMAILS}
          EOF

          cat >.env.local <<EOF
          NEXT_PUBLIC_FIREBASE_APIKEY='${NEXT_PUBLIC_FIREBASE_APIKEY}'
          NEXT_PUBLIC_BUILD_ID='$VERSION'
          NEXT_PUBLIC_OAUTH_CLIENT_ID='${NEXT_PUBLIC_OAUTH_CLIENT_ID}'
          NEXT_PUBLIC_FIRESTORE_DB="${NEXT_PUBLIC_FIRESTORE_DB}"
          NEXT_PUBLIC_RECAPTCHA_KEY="${NEXT_PUBLIC_RECAPTCHA_KEY}"
          AUTH_SECRET='${AUTH_SECRET}'
          NEXTAUTH_URL='${NEXTAUTH_URL}'
          NEXTAUTH_URL_INTERNAL=http://localhost:8080
          EOF

      # - id: 'deploy'
      #   uses: 'google-github-actions/deploy-cloudrun@v2'
      #   with:
      #     service: ${{vars.RUN_SERVICE}}
      #     image: ${{ steps.env.outputs.IMAGE_TAG}}
      #     region: ${{vars.RUN_REGION}}
      #     project_id: ${{vars.CLOUDSDK_CORE_PROJECT}}
      #     tag: ${{steps.env.outputs.VERSION_TAG}}
      #     # service account is not available
      #     # service_account: ${{ secrets.GOOGLE_SERVICE_ACCOUNT}}
      #     secrets: |-
      #       NEXT_PUBLIC_FIREBASE_APIKEY=NEXT_PUBLIC_FIREBASE_APIKEY:latest
      #       AUTH_SECRET=AUTH_SECRET:latest
      #       EINSATZMAPPE_SHEET_ID=EINSATZMAPPE_SHEET_ID:latest,EINSATZMAPPE_SHEET_RANGE=EINSATZMAPPE_SHEET_RANGE:latest

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: "Authenticate to Google Cloud"
        uses: "google-github-actions/auth@v3"
        if: ${{ env.workload_identity_provider != '' }}
        with:
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }} # this is the output provider_name from the TF module
          service_account: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }} # this is a SA email configured
          export_environment_variables: "true"

      - name: "Set up Cloud SDK"
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker for Artifact Registry
        if: ${{ env.workload_identity_provider != '' }}
        run: gcloud auth configure-docker ${RUN_REGION}-docker.pkg.dev --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker

      - id: image
        name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ env.workload_identity_provider != '' }}
          tags: ${{ env.IMAGE_TAG }}
          build-args: |
            DOCKER_REGISTRY=${{ env.workload_identity_provider != '' && format('{0}-docker.pkg.dev/{1}/dockerhub/', env.RUN_REGION, env.GOOGLE_CLOUD_PROJECT) || '' }}
            NEXT_PUBLIC_FIREBASE_APIKEY=${{ env.NEXT_PUBLIC_FIREBASE_APIKEY }}
            NEXT_PUBLIC_FIRESTORE_DB=${{ env.NEXT_PUBLIC_FIRESTORE_DB }}
            NEXT_PUBLIC_OAUTH_CLIENT_ID=${{ env.NEXT_PUBLIC_OAUTH_CLIENT_ID }}
            NEXT_PUBLIC_RECAPTCHA_KEY=${{ env.NEXT_PUBLIC_RECAPTCHA_KEY }}
            NEXT_PUBLIC_BUILD_ID=${{ steps.env.outputs.VERSION }}
          cache-from: ${{ env.workload_identity_provider != '' && format('type=registry,ref={0}:cache', env.IMAGE) || '' }}
          cache-to: ${{ env.workload_identity_provider != '' && 'type=inline' || '' }}
      - id: deploy
        name: deploy to Cloud Run
        if: ${{ env.workload_identity_provider != '' }}
        run: |
          set -eo pipefail

          # --memory: Der PDF-Export des Fahrtenbuchs legt sein Dokument im
          # Speicher aus. Seit #665 geschieht das in Teilen, wodurch der
          # Spitzenbedarf bei rund 300 MB liegt statt bei über 600 MB — aber
          # Cloud Run lässt bis zu 80 Anfragen auf dieselbe Instanz, und die
          # bisherigen 512Mi (der Vorgabewert, hier nie gesetzt) hatten dafür
          # keine Reserve. Ohne das Flag behielte der Dienst stillschweigend
          # seinen alten Wert.
          gcloud run deploy $RUN_SERVICE \
            --allow-unauthenticated \
            --image $IMAGE_TAG \
            --execution-environment gen2 \
            --memory=1Gi \
            --max-instances=2 --region $RUN_REGION \
            --tag=${VERSION_TAG} \
            --service-account=$RUN_SERVICE_ACCOUNT \
            --update-secrets="AUTH_SECRET=AUTH_SECRET:latest,GOOGLE_SERVICE_ACCOUNT=GOOGLE_SERVICE_ACCOUNT:latest,BLAULICHTSMS_USERNAME=BLAULICHTSMS_USERNAME:latest,BLAULICHTSMS_PASSWORD=BLAULICHTSMS_PASSWORD:latest,BLAULICHTSMS_CUSTOMER_ID=BLAULICHTSMS_CUSTOMER_ID:latest,SUMUP_API_KEY=SUMUP_API_KEY${SUMUP_SECRET_SUFFIX}:latest,SUMUP_AFFILIATE_KEY=SUMUP_AFFILIATE_KEY${SUMUP_SECRET_SUFFIX}:latest,SUMUP_MERCHANT_CODE=SUMUP_MERCHANT_CODE${SUMUP_SECRET_SUFFIX}:latest" \
            --remove-secrets="NEXT_PUBLIC_FIREBASE_APIKEY,NEXT_PUBLIC_MAPBOX_APIKEY,EINSATZMAPPE_SHEET_ID,EINSATZMAPPE_SHEET_RANGE,EINSATZMAPPE_SHEET_FOLDER" \
           --update-env-vars="^@@^NEXTAUTH_URL=${NEXTAUTH_URL}@@NEXTAUTH_URL_INTERNAL=http://localhost:8080@@NEXT_PUBLIC_FIREBASE_APIKEY=${NEXT_PUBLIC_FIREBASE_APIKEY}@@EINSATZMAPPE_IMPERSONATION_ACCOUNT=${EINSATZMAPPE_IMPERSONATION_ACCOUNT}@@NEXT_PUBLIC_RECAPTCHA_KEY=${NEXT_PUBLIC_RECAPTCHA_KEY}@@GOOGLE_CLOUD_PROJECT=${GOOGLE_CLOUD_PROJECT}@@CRON_INVOKER_EMAILS=${CRON_INVOKER_EMAILS}" \
            ${RUN_ARGS}
