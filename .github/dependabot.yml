# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      dependencies:
        patterns:
          - '*'

  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      dependencies:
        update-types:
          - 'minor'
          - 'patch'
        patterns:
          - '*'
    ignore:
      # jsdom ab 30.1 versteckt die Blob-Implementierung hinter einem privaten
      # Feld; vitests makeCompatBlob sucht sie weiter über getOwnPropertySymbols
      # und scheitert mit „Cannot read properties of undefined (reading
      # '_buffer')". Pin auflösen, sobald vitest den Fix released hat:
      # https://github.com/vitest-dev/vitest/pull/11300
      - dependency-name: 'jsdom'
        versions: ['>=30.1.0']
