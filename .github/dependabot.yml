# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      dependencies:
        patterns:
          - '*'

  # Provider und Module der OpenTofu-Roots samt .terraform.lock.hcl. Die
  # Version des tofu-Binaries selbst steht in .tool-versions (auch die
  # Pipelines lesen sie dort); das Format kennt Dependabot nicht, sie bleibt
  # Handarbeit. Die Module stehen mit drin, damit ein Major-Sprung des
  # Providers (~> 7 → ~> 8) die Einschränkung überall anhebt; sonst scheitert
  # `tofu init` an widersprüchlichen Constraints.
  - package-ecosystem: 'opentofu'
    directories:
      - '/terraform/environments/*'
      - '/terraform/projects/*'
      - '/terraform/modules/*'
    schedule:
      interval: 'weekly'
    groups:
      providers:
        patterns:
          - '*'

  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      dependencies:
        update-types:
          - 'minor'
          - 'patch'
        patterns:
          - '*'
    ignore:
      # jsdom ab 30.1 versteckt die Blob-Implementierung hinter einem privaten
      # Feld; vitests makeCompatBlob sucht sie weiter über getOwnPropertySymbols
      # und scheitert mit „Cannot read properties of undefined (reading
      # '_buffer')". Pin auflösen, sobald vitest den Fix released hat:
      # https://github.com/vitest-dev/vitest/pull/11300
      - dependency-name: 'jsdom'
        versions: ['>=30.1.0']
