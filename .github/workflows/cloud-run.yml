name: "Cloud Run"

# Vier Wege hier hinein, und nur drei davon rollen aus:
#
#   Push auf main      -> Build, Projekt-Basis, Apply auf dev
#   Release-Tag v*     -> Build, Projekt-Basis, Apply auf prod
#   Run workflow       -> dasselbe für den gewählten Branch; auf einem Branch
#                         geht es nach dev, auf einem Tag nach prod. Das ist
#                         der Weg, einen Feature-Branch auf dev auszuprobieren.
#   Pull Request       -> nur Build, Lint und Tests. Kein Apply (ungeprüfter
#                         Terraform-Code aus einem PR-Branch gegen die geteilte
#                         Dev-Umgebung) und deshalb auch KEIN Push in die
#                         Registry: ein Image, das nie eine Revision wird,
#                         gehört dort nicht hin.
on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      serving_revision:
        description: "Leer lassen, um diesen Branch zu bauen und auf dev auszurollen. Für einen Rollback stattdessen die Revision eintragen, die den Traffic bekommen soll."
        type: string
        required: false
        default: ""
  repository_dispatch:
    types:
      - deploy

env:
  # Muss zu terraform/.tool-versions und zu .github/workflows/terraform.yml
  # passen, damit lokal und beide Pipelines identisch rechnen.
  TOFU_VERSION: 1.12.5

  # Zuordnung Environment -> Projekt-Root. Die Projekt-Basis gibt es einmal je
  # GCP-Projekt, nicht je Environment; dev und prod teilen sich ffn-utils,
  # deshalb stehen links und rechts derzeit dieselben Pfade. Bekommt dev ein
  # eigenes Projekt, wird der rechte Zweig auf dessen Root umgestellt — mehr ist
  # an diesem Workflow nicht zu ändern.
  BASE_ROOT: ${{ github.ref_type == 'tag' && 'terraform/projects/ffn-utils' || 'terraform/projects/ffn-utils' }}

jobs:
  build:
    name: "Build"
    # Ein Rollback baut nichts: Es zeigt auf eine Revision, die es schon gibt.
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.serving_revision == '' }}
    runs-on: ubuntu-latest
    # Nur der Build darf abgebrochen werden. Der Deploy-Job hat seine eigene
    # Gruppe ohne cancel-in-progress — ein mitten im `tofu apply` abgeschossener
    # Lauf hinterließe ein hängendes State-Lock.
    concurrency:
      group: cloud-run-build-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    permissions:
      id-token: write # required for requesting the JWT
      contents: read # required for actions/checkout
    defaults:
      run:
        shell: bash
    outputs:
      image_tag: ${{ steps.env.outputs.IMAGE_TAG }}
      # Was terraform ausrollt — siehe den Step "Image-Referenz auf den Digest
      # festnageln". Nicht image_tag verwenden: der ist veränderlich.
      image_ref: ${{ steps.digest.outputs.IMAGE_REF }}
      version: ${{ steps.env.outputs.VERSION }}
      version_tag: ${{ steps.env.outputs.VERSION_TAG }}
      run_service: ${{ steps.env.outputs.RUN_SERVICE }}
      pushed: ${{ steps.env.outputs.PUSHED }}
    env:
      DEBIAN_FRONTEND: noninteractive
      NEXT_PUBLIC_FIREBASE_APIKEY: ${{ vars.NEXT_PUBLIC_FIREBASE_APIKEY }}
      NEXT_PUBLIC_OAUTH_CLIENT_ID: ${{ vars.NEXT_PUBLIC_OAUTH_CLIENT_ID }}
      NEXT_PUBLIC_FIRESTORE_DB: ${{ vars.NEXT_PUBLIC_FIRESTORE_DB }}
      NEXT_PUBLIC_RECAPTCHA_KEY: ${{ vars.NEXT_PUBLIC_RECAPTCHA_KEY }}
      GOOGLE_CLOUD_PROJECT: ${{ vars.GOOGLE_CLOUD_PROJECT }}
      RUN_SERVICE: ${{ vars.RUN_SERVICE }}
      RUN_REGION: ${{ vars.RUN_REGION }}
      CLOUDSDK_CORE_PROJECT: ${{ vars.CLOUDSDK_CORE_PROJECT }}
      CLOUDSDK_COMPUTE_REGION: ${{ vars.CLOUDSDK_COMPUTE_REGION }}
      IMAGE: ${{ vars.IMAGE }}
      workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Setup env
        shell: bash
        id: env
        run: |
          set -eo pipefail

          # GITHUB_REF_NAME ist bei einem Tag "v2.63.0" und bei einem Branch
          # dessen Name — anders als das frühere ${GITHUB_REF#refs/heads/},
          # das bei Tags nichts abschnitt und Revisionen wie
          # "refs-tags-v2-63-0" hinterließ.
          VERSION="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          VERSION_TAG="$(scripts/cloud-run-tfvars.sh --print-tag --version "$VERSION")"

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            export NEXT_PUBLIC_FIRESTORE_DB=""
            RUN_SERVICE="$(echo -n "${RUN_SERVICE}" | sed 's/-dev$//')"
          fi

          if [[ "${NEXT_PUBLIC_FIRESTORE_DB}" == "default" || "${NEXT_PUBLIC_FIRESTORE_DB}" == "(default)" ]]; then
            # '(default)' / 'default' sentinel -> empty string selects the default DB
            export NEXT_PUBLIC_FIRESTORE_DB=""
          fi

          # Die NEXT_PUBLIC_*-Werte werden von next build fest ins Client-Bundle
          # inlined. Fehlen sie, baut das Image fehlerfrei und die App ist erst im
          # Browser kaputt ('"projectId" not provided in firebase.initializeApp.').
          # Ein Deploy ohne Firebase-Konfiguration bricht deshalb hier ab.
          if [[ -n "${workload_identity_provider}" && -z "${NEXT_PUBLIC_FIREBASE_APIKEY}" ]]; then
            echo "::error::Repository-Variable NEXT_PUBLIC_FIREBASE_APIKEY ist leer - das Image würde ohne Firebase-Konfiguration gebaut."
            exit 1
          fi

          # Gepusht wird nur, was auch ausgerollt wird. Ein Pull Request plant
          # bloß; sein Image würde in der Registry liegen, ohne je eine
          # Revision zu werden — und dort von keiner Aufräumregel erfasst, weil
          # die an den Revisionen hängt und nicht an den Layern. Gebaut wird
          # trotzdem, der Build ist der Test, dass das Image überhaupt entsteht.
          #
          # Kein `[[ … ]] && PUSHED=true` als eigenständige Zeile: Ist die
          # Bedingung falsch, gibt die Zeile 1 zurück und `set -e` beendet den
          # Step.
          PUSHED=false
          if [[ -n "${workload_identity_provider}" && "${GITHUB_EVENT_NAME}" != "pull_request" ]]; then
            PUSHED=true
          fi

          echo "Environment:"
          cat <<EOF | tee -a "$GITHUB_ENV" | tee -a "$GITHUB_OUTPUT"
          VERSION=${VERSION}
          VERSION_TAG=${VERSION_TAG}
          RUN_SERVICE=${RUN_SERVICE}
          RUN_REGION=${RUN_REGION}
          NEXT_PUBLIC_FIRESTORE_DB=${NEXT_PUBLIC_FIRESTORE_DB}
          IMAGE=${IMAGE}
          IMAGE_TAG=${IMAGE}:${VERSION_TAG}
          NEXT_PUBLIC_RECAPTCHA_KEY=${NEXT_PUBLIC_RECAPTCHA_KEY}
          PUSHED=${PUSHED}
          EOF

          # .env.local liefert next build dieselben NEXT_PUBLIC_*-Werte wie die
          # Build-Args. Ohne Laufzeit-Geheimnisse: die kommen aus Secret Manager
          # und würden hier nur in einer Image-Layer landen.
          cat >.env.local <<EOF
          NEXT_PUBLIC_FIREBASE_APIKEY='${NEXT_PUBLIC_FIREBASE_APIKEY}'
          NEXT_PUBLIC_BUILD_ID='$VERSION'
          NEXT_PUBLIC_OAUTH_CLIENT_ID='${NEXT_PUBLIC_OAUTH_CLIENT_ID}'
          NEXT_PUBLIC_FIRESTORE_DB="${NEXT_PUBLIC_FIRESTORE_DB}"
          NEXT_PUBLIC_RECAPTCHA_KEY="${NEXT_PUBLIC_RECAPTCHA_KEY}"
          NEXTAUTH_URL_INTERNAL=http://localhost:8080
          EOF

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: "Authenticate to Google Cloud"
        uses: "google-github-actions/auth@v3"
        if: ${{ env.workload_identity_provider != '' }}
        with:
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }} # this is the output provider_name from the TF module
          service_account: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }} # this is a SA email configured
          export_environment_variables: "true"

      - name: "Set up Cloud SDK"
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker for Artifact Registry
        if: ${{ env.workload_identity_provider != '' }}
        run: gcloud auth configure-docker ${RUN_REGION}-docker.pkg.dev --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker

      - id: image
        name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          # Siehe "PUSHED" im Setup-env-Step: ein PR baut, pusht aber nicht.
          push: ${{ steps.env.outputs.PUSHED == 'true' }}
          tags: ${{ env.IMAGE_TAG }}
          build-args: |
            DOCKER_REGISTRY=${{ env.workload_identity_provider != '' && format('{0}-docker.pkg.dev/{1}/dockerhub/', env.RUN_REGION, env.GOOGLE_CLOUD_PROJECT) || '' }}
            NEXT_PUBLIC_FIREBASE_APIKEY=${{ env.NEXT_PUBLIC_FIREBASE_APIKEY }}
            NEXT_PUBLIC_FIRESTORE_DB=${{ env.NEXT_PUBLIC_FIRESTORE_DB }}
            NEXT_PUBLIC_OAUTH_CLIENT_ID=${{ env.NEXT_PUBLIC_OAUTH_CLIENT_ID }}
            NEXT_PUBLIC_RECAPTCHA_KEY=${{ env.NEXT_PUBLIC_RECAPTCHA_KEY }}
            NEXT_PUBLIC_BUILD_ID=${{ steps.env.outputs.VERSION }}
          # Lesen darf der PR-Build aus der Registry, schreiben nicht — der
          # Inline-Cache steckt im gepushten Image und entsteht ohne Push nicht.
          cache-from: ${{ env.workload_identity_provider != '' && format('type=registry,ref={0}:cache', env.IMAGE) || '' }}
          cache-to: ${{ steps.env.outputs.PUSHED == 'true' && 'type=inline' || '' }}

      # Terraform bekommt den Digest, nicht den Tag.
      #
      # Der Revisionsname enthält einen Fingerabdruck über alles, was ins
      # Template einfließt — darunter die Image-Referenz. Ein Tag ist aber
      # veränderlich: Jeder Push auf main baut nach `…:main`. Zwei Pushes
      # hintereinander ergäben denselben Fingerabdruck, denselben
      # Revisionsnamen, damit "no changes" — und das neue Image würde nie
      # ausgerollt. Mit `gcloud run deploy` fiel das nicht auf, weil gcloud
      # jedes Mal einen frischen Revisionsnamen erzeugt.
      #
      # Der Digest ändert sich genau dann, wenn sich der Inhalt ändert. Damit
      # sagt der Fingerabdruck die Wahrheit: neues Image -> neue Revision,
      # unverändertes Image -> kein Deploy. Der Tag bleibt trotzdem in der
      # Registry, er ist der Einstieg für Menschen.
      # Nur nach einem Push: Ohne ihn liefert die Action bestenfalls eine
      # lokale Image-ID, und die ist keine Referenz, die Cloud Run auflösen
      # könnte.
      - id: digest
        name: Image-Referenz auf den Digest festnageln
        if: ${{ steps.env.outputs.PUSHED == 'true' }}
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -eo pipefail
          if [[ -z "$DIGEST" ]]; then
            echo "::error::Der Build hat keinen Digest geliefert — ohne ihn wäre der Revisionsname nicht eindeutig."
            exit 1
          fi
          echo "IMAGE_REF=${IMAGE}@${DIGEST}" | tee -a "$GITHUB_OUTPUT"

  # Die Projekt-Basis läuft vor jedem Environment-Apply, nicht als Handgriff bei
  # Gelegenheit. Sie enthält, was ein Environment-Apply bereits vorfinden muss —
  # Rechte des Pipeline-SA, aktivierte APIs, Secret-Hüllen. Solange sie am
  # prod-Root hing, wurde eine neue Rolle erst beim nächsten Release wirksam und
  # dev scheiterte bis dahin mit 403.
  #
  # Ohne `needs`, damit sie parallel zum Build läuft: Sie hängt vom Image nicht
  # ab, und der Deploy wartet ohnehin auf beide.
  base:
    name: "Projekt-Basis"
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    # Eine Gruppe, weil es einen Projekt-Root gibt. Kommt mit einem eigenen
    # dev-Projekt ein zweiter dazu, muss der Root im Gruppennamen stehen —
    # sonst applizieren dev und prod denselben State gleichzeitig.
    concurrency:
      group: tf-apply-base
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    env:
      gcp_ready: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER != '' && secrets.TERRAFORM_SERVICE_ACCOUNT != '' }}
      TF_IN_AUTOMATION: "true"
      TF_VAR_project: ${{ vars.CLOUDSDK_CORE_PROJECT }}
      TF_VAR_github_org: ${{ github.repository_owner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup OpenTofu
        if: ${{ env.gcp_ready == 'true' }}
        uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tofu_wrapper: false

      - name: "Authenticate to Google Cloud"
        if: ${{ env.gcp_ready == 'true' }}
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.TERRAFORM_SERVICE_ACCOUNT }}
          export_environment_variables: "true"

      - name: Init
        if: ${{ env.gcp_ready == 'true' }}
        working-directory: ${{ env.BASE_ROOT }}
        run: tofu init -input=false

      - name: Apply
        if: ${{ env.gcp_ready == 'true' }}
        working-directory: ${{ env.BASE_ROOT }}
        run: tofu apply -input=false -no-color -auto-approve

  deploy:
    name: "Deploy ${{ github.ref_type == 'tag' && 'prod' || 'dev' }}"
    needs: [build, base]
    # Kein Deploy aus einem Pull Request. Der Deploy ist jetzt ein `tofu apply`,
    # und ein apply mit ungeprüftem Terraform-Code aus einem PR-Branch gegen die
    # gemeinsame Dev-Umgebung wäre nicht zu verantworten. Einen Branch auf dev
    # ausprobieren geht über workflow_dispatch auf diesem Branch.
    #
    # `always()`, weil der Build beim Rollback übersprungen wird — die Zeilen
    # darunter schließen aus, dass ein gescheiterter Build trotzdem deployt.
    # Die Projekt-Basis muss dagegen gelaufen sein: Ohne sie fehlen dem
    # Environment-Apply womöglich Rechte oder Secret-Hüllen.
    if: >-
      always() &&
      github.event_name != 'pull_request' &&
      needs.base.result == 'success' &&
      needs.build.result != 'failure' &&
      needs.build.result != 'cancelled' &&
      (needs.build.result == 'skipped' || needs.build.outputs.pushed == 'true')
    runs-on: ubuntu-latest
    environment: ${{ github.ref_type == 'tag' && 'prod' || 'dev' }}
    # Dieselbe Gruppe wie die apply-Jobs in terraform.yml: Beide Workflows
    # applien denselben State, zwei gleichzeitige Läufe sind ausgeschlossen.
    concurrency:
      group: tf-apply-${{ github.ref_type == 'tag' && 'prod' || 'dev' }}
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        shell: bash
        working-directory: terraform/environments/${{ github.ref_type == 'tag' && 'prod' || 'dev' }}
    env:
      TF_IN_AUTOMATION: "true"
      TF_VAR_project: ${{ vars.CLOUDSDK_CORE_PROJECT }}
      TF_VAR_github_org: ${{ github.repository_owner }}
      TF_VAR_build_service_account: ${{ secrets.TF_BUILD_SERVICE_ACCOUNT }}
      TF_VAR_firebase_config: ${{ vars.NEXT_PUBLIC_FIREBASE_APIKEY }}
      TF_VAR_recaptcha_key: ${{ vars.NEXT_PUBLIC_RECAPTCHA_KEY }}
      TF_VAR_einsatzmappe_impersonation_account: ${{ secrets.EINSATZMAPPE_IMPERSONATION_ACCOUNT }}
      TF_VAR_serving_revision: ${{ inputs.serving_revision }}
      RUN_REGION: ${{ vars.RUN_REGION }}
      # Leer, wenn der Build übersprungen wurde (Rollback) — dann übernimmt das
      # Skript Image und Revisions-Suffix aus dem laufenden Dienst.
      #
      # IMAGE_REF ist die Digest-Referenz und das, was ausgerollt wird;
      # IMAGE_TAG steht nur noch in der Zusammenfassung, damit dort etwas
      # Lesbares auftaucht.
      IMAGE_REF: ${{ needs.build.outputs.image_ref }}
      IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
      VERSION: ${{ needs.build.outputs.version }}
      RUN_SERVICE_BASE: ${{ vars.RUN_SERVICE }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tofu_wrapper: false

      - name: "Authenticate to Google Cloud"
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.TERRAFORM_SERVICE_ACCOUNT }}
          export_environment_variables: "true"

      - name: "Set up Cloud SDK"
        uses: google-github-actions/setup-gcloud@v3

      # Aufbewahrung der Traffic-Tags. prod hält ein Rollback-Fenster über die
      # letzten Releases, dev nur die Tags noch existierender Branches — ein
      # gemergter Branch verliert seinen Tag damit von selbst. Ohne Regel wüchse
      # die Liste unbegrenzt, und jeder Tag hält seine Revision dauerhaft aus
      # Cloud Runs automatischer Bereinigung.
      - name: Deploy-Variablen erzeugen
        working-directory: ${{ github.workspace }}
        run: |
          set -eo pipefail

          RUN_SERVICE="$RUN_SERVICE_BASE"
          [[ "$GITHUB_REF_TYPE" == "tag" ]] && RUN_SERVICE="${RUN_SERVICE%-dev}"

          # Ohne neues Image (Rollback) bleibt das laufende stehen; das Skript
          # liest es dann selbst aus dem Dienst.
          args=()
          if [[ -n "$IMAGE_REF" ]]; then
            args+=(--image "$IMAGE_REF" --version "$VERSION")
          fi

          scripts/cloud-run-tfvars.sh \
            --service "$RUN_SERVICE" \
            --project "$TF_VAR_project" \
            --region "$RUN_REGION" \
            "${args[@]}" \
            ${{ github.ref_type == 'tag' && '--keep 20' || '--keep-branches' }} \
            --out "terraform/environments/${{ github.ref_type == 'tag' && 'prod' || 'dev' }}/cloudrun.auto.tfvars.json"

      - name: Init
        run: tofu init -input=false

      - name: Apply
        run: tofu apply -input=false -no-color -auto-approve

      - name: Step summary
        if: ${{ always() }}
        run: |
          {
            echo "## Deploy — ${{ github.ref_type == 'tag' && 'prod' || 'dev' }}"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Image | \`${IMAGE_TAG}\` |"
            echo "| Ausgerollt | \`${IMAGE_REF:-(unverändert)}\` |"
            echo "| Revision | \`$(tofu output -raw run_revision 2>/dev/null || echo '?')\` |"
            echo "| URL | $(tofu output -raw run_service_uri 2>/dev/null || echo '?') |"
            echo
            echo "Rollback: dieser Workflow über *Run workflow* mit \`serving_revision\`."
            echo
            echo "<details><summary>Traffic-Tags (Rollback-Ziele)</summary>"
            echo
            echo '```json'
            tofu output -json run_traffic_tags 2>/dev/null | jq . 2>/dev/null || echo '{}'
            echo '```'
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
