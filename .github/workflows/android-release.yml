name: "Android Release"

on:
  push:
    branches: [ main ]
    paths:
      - "capacitor/**"
      - ".github/workflows/android-release.yml"
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      alpha:
        description: "Alpha-Nummer (für manuellen Build, hängt -alpha<N> an den letzten Tag)"
        required: true
        default: "0"
      promote_to_production:
        description: "Auch auf Production-Track veröffentlichen (Standard: nur Internal Testing)"
        type: boolean
        required: false
        default: false

concurrency:
  group: android-release-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: "Build & Publish AAB"
    runs-on: ubuntu-latest
    permissions:
      id-token: write # WIF
      contents: write # GitHub Release Asset upload
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # für git rev-list / git describe

      - name: Authenticate to Google (WIF)
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.PLAY_UPLOAD_SA_EMAIL }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher

      - name: Determine versionCode, versionName, tracks
        id: version
        env:
          ALPHA: ${{ inputs.alpha || '0' }}
          PROMOTE_TO_PRODUCTION: ${{ inputs.promote_to_production || 'false' }}
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          PACKAGE_NAME: at.ffnd.einsatzkarte
        run: |
          set -euo pipefail

          # Der Commit-Zähler allein genügt nicht als versionCode: derselbe
          # Commit kann mehrfach gebaut werden (z.B. Push-Test-Release auf den
          # internal-Track und später ein Release-Event am selben Commit für
          # production). Beide bekämen denselben versionCode und der zweite
          # Upload schlägt mit "Version code N has already been used" fehl.
          # Daher den höchsten bereits im Play Store vorhandenen versionCode
          # abfragen und sicherstellen, dass wir strikt darüber liegen.
          BASE_CODE=$(git rev-list --count HEAD)
          API="https://androidpublisher.googleapis.com/androidpublisher/v3/applications/${PACKAGE_NAME}"
          PROBE_EDIT_ID=$(curl -fsS -X POST \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            "${API}/edits" | jq -r '.id')
          MAX_PLAY_CODE=$(curl -fsS \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            "${API}/edits/${PROBE_EDIT_ID}/bundles" \
            | jq '[.bundles[]?.versionCode] | max // 0')
          # Probe-Edit wieder verwerfen — der eigentliche Upload legt einen
          # frischen Edit an.
          curl -fsS -X DELETE \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            "${API}/edits/${PROBE_EDIT_ID}" || true
          if (( MAX_PLAY_CODE + 1 > BASE_CODE )); then
            VERSION_CODE=$(( MAX_PLAY_CODE + 1 ))
          else
            VERSION_CODE="${BASE_CODE}"
          fi
          echo "git rev-list count=${BASE_CODE}, höchster Play versionCode=${MAX_PLAY_CODE} -> versionCode=${VERSION_CODE}"

          if [[ "${GITHUB_EVENT_NAME}" == "release" ]]; then
            VERSION_NAME="${GITHUB_REF_NAME#v}"
            TRACKS="internal production"
          elif [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            # Automatisches Test-Release auf main: nur an die Test-User (Internal Testing)
            LATEST_TAG=$(git describe --tags --abbrev=0 --match='v*')
            VERSION_NAME="${LATEST_TAG#v}-test${VERSION_CODE}"
            TRACKS="internal"
          else
            if ! [[ "${ALPHA}" =~ ^[0-9]+$ ]]; then
              echo "Invalid alpha input: ${ALPHA}" >&2
              exit 1
            fi
            LATEST_TAG=$(git describe --tags --abbrev=0 --match='v*')
            VERSION_NAME="${LATEST_TAG#v}-alpha${ALPHA}"
            if [[ "${PROMOTE_TO_PRODUCTION}" == "true" ]]; then
              TRACKS="internal production"
            else
              TRACKS="internal"
            fi
          fi
          {
            echo "VERSION_CODE=${VERSION_CODE}"
            echo "VERSION_NAME=${VERSION_NAME}"
            echo "TRACKS=${TRACKS}"
          } | tee -a "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: capacitor/package-lock.json

      - name: Install Capacitor dependencies
        working-directory: capacitor
        run: npm ci

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "21"
          cache: "gradle"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Decode keystore + write keystore.properties
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          echo "${KEYSTORE_BASE64}" | base64 -d > capacitor/android/release.keystore
          umask 077
          {
            echo "storeFile=release.keystore"
            echo "storePassword=${KEYSTORE_PASSWORD}"
            echo "keyAlias=ffn-einsatzkarte"
            echo "keyPassword=${KEY_PASSWORD}"
          } > capacitor/android/keystore.properties

      - name: Capacitor sync
        working-directory: capacitor
        run: npx cap sync android

      - name: Build AAB
        working-directory: capacitor/android
        env:
          VERSION_CODE: ${{ steps.version.outputs.VERSION_CODE }}
          VERSION_NAME: ${{ steps.version.outputs.VERSION_NAME }}
        run: |
          ./gradlew bundleRelease \
            "-PappVersionCode=${VERSION_CODE}" \
            "-PappVersionName=${VERSION_NAME}"

      - name: Upload AAB to Play Store
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          PACKAGE_NAME: at.ffnd.einsatzkarte
          AAB_PATH: capacitor/android/app/build/outputs/bundle/release/app-release.aab
          VERSION_CODE: ${{ steps.version.outputs.VERSION_CODE }}
          VERSION_NAME: ${{ steps.version.outputs.VERSION_NAME }}
          TRACKS: ${{ steps.version.outputs.TRACKS }}
        run: |
          set -euo pipefail
          API="https://androidpublisher.googleapis.com/androidpublisher/v3/applications/${PACKAGE_NAME}"
          UPLOAD_API="https://androidpublisher.googleapis.com/upload/androidpublisher/v3/applications/${PACKAGE_NAME}"

          gcall() {
            local resp_file
            resp_file=$(mktemp)
            local code
            code=$(curl -sS -o "${resp_file}" -w "%{http_code}" "$@")
            if [[ ! "${code}" =~ ^2[0-9]{2}$ ]]; then
              echo "HTTP ${code} from $*" >&2
              cat "${resp_file}" >&2
              rm -f "${resp_file}"
              exit 1
            fi
            cat "${resp_file}"
            rm -f "${resp_file}"
          }

          echo "==> Creating edit"
          EDIT_ID=$(gcall -X POST -H "Authorization: Bearer ${ACCESS_TOKEN}" "${API}/edits" | jq -r '.id')
          echo "Edit ID: ${EDIT_ID}"

          echo "==> Uploading AAB ($(du -h "${AAB_PATH}" | cut -f1))"
          UPLOADED_VC=$(gcall -X POST \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "Content-Type: application/octet-stream" \
            --data-binary "@${AAB_PATH}" \
            "${UPLOAD_API}/edits/${EDIT_ID}/bundles?uploadType=media" | jq -r '.versionCode')
          echo "Uploaded versionCode: ${UPLOADED_VC} (expected ${VERSION_CODE})"

          TRACK_BODY=$(jq -nc \
            --arg name "${VERSION_NAME}" \
            --arg vc "${UPLOADED_VC}" \
            '{releases: [{name: $name, versionCodes: [$vc], status: "completed"}]}')
          for TRACK in ${TRACKS}; do
            echo "==> Assigning to track ${TRACK}"
            gcall -X PATCH \
              -H "Authorization: Bearer ${ACCESS_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "${TRACK_BODY}" \
              "${API}/edits/${EDIT_ID}/tracks/${TRACK}" >/dev/null
          done

          echo "==> Committing edit"
          commit_resp=$(mktemp)
          commit_edit() {  # $1 = optional query string, e.g. "?changesNotSentForReview=true"
            curl -sS -o "${commit_resp}" -w "%{http_code}" \
              -X POST -H "Authorization: Bearer ${ACCESS_TOKEN}" \
              "${API}/edits/${EDIT_ID}:commit${1:-}"
          }

          if [[ " ${TRACKS} " == *" production "* ]]; then
            # Production changes can be auto-submitted for review; fall back to a
            # plain commit if Play refuses to send them for review automatically.
            commit_code=$(commit_edit)
            if [[ "${commit_code}" =~ ^2[0-9]{2}$ ]]; then
              echo "Edit committed (auto-submitted for review)"
            elif [[ "${commit_code}" == "400" ]] && grep -q "changesNotSentForReview" "${commit_resp}"; then
              echo "Auto-review unavailable for this edit, retrying with changesNotSentForReview=true"
              commit_code=$(commit_edit "?changesNotSentForReview=true")
              if [[ ! "${commit_code}" =~ ^2[0-9]{2}$ ]]; then
                echo "HTTP ${commit_code} from commit retry" >&2
                cat "${commit_resp}" >&2
                rm -f "${commit_resp}"
                exit 1
              fi
              echo "::warning::Edit committed without auto-review. Submit manually in the Play Console."
            else
              echo "HTTP ${commit_code} from commit" >&2
              cat "${commit_resp}" >&2
              rm -f "${commit_resp}"
              exit 1
            fi
          else
            # Internal-testing-only edits are never sent for review (releases go
            # live immediately), so changesNotSentForReview=true is the only valid path.
            commit_code=$(commit_edit "?changesNotSentForReview=true")
            if [[ ! "${commit_code}" =~ ^2[0-9]{2}$ ]]; then
              echo "HTTP ${commit_code} from commit" >&2
              cat "${commit_resp}" >&2
              rm -f "${commit_resp}"
              exit 1
            fi
            echo "Edit committed (internal testing — no review required)"
          fi
          rm -f "${commit_resp}"
          echo "Done — versionName=${VERSION_NAME} versionCode=${UPLOADED_VC} tracks=${TRACKS}"

      - name: Attach AAB to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          files: capacitor/android/app/build/outputs/bundle/release/app-release.aab

      - name: Cleanup keystore
        if: always()
        run: |
          rm -f capacitor/android/release.keystore capacitor/android/keystore.properties
